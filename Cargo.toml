[package]
name = "nsh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
dirs = "6.0.0"
libc = "0.2.189"
portable-pty = "0.9.0"
rand = "0.10.2"
rmcp = { version = "2.2.0", default-features = false, features = ["client", "transport-child-process"] }
rustyline = { version = "18.0.1", features = ["derive", "with-fuzzy"] }
shell-words = "1.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = "3.1.2"
signal-hook = "0.4.4"
tempfile = "3.27.0"
tokio = { version = "1.48.0", features = ["rt", "time", "process", "sync"] }
toml = "1.1.3"
ureq = { version = "3.3.0", features = ["json"] }
